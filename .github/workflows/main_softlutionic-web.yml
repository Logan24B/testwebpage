name: Deploy Softlutionic static website to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: softlutionic-web
  AZURE_WEBAPP_PACKAGE_PATH: '.'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7DDEBE9F90564620BB2EE5385837A909 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_17BDD12491F742CAACC09EF26F6106CB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_75ECA53B92EF4D0C902813786186A304 }}

      - name: Show repository files
        run: |
          pwd
          ls -la

      - name: Deploy Softlutionic website
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
